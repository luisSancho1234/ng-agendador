
<div class="mt-10 flex items-center justify-center">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 space-y-8">
    <div class="text-center">
      <h1 class="text-3xl font-extrabold text-blue-900">Agendador</h1>
      <p class="mt-2 text-sm text-gray-600">Bem-vindo de volta! Por favor, entre em sua conta.</p>
    </div>

    <form [formGroup]="authForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Usuário</label>
        <div class="relative">
          <input
            id="username"
            type="text"
            formControlName="username"
            class="input-style !border-gray-300 focus:!border-blue-600 focus:ring-1 focus:ring-blue-600"
            placeholder="Seu nome de usuário"
          />
        </div>
        <p *ngIf="authForm.controls.username.invalid && authForm.controls.username.touched" class="mt-1 text-xs text-red-500">
          O campo usuário é obrigatório.
        </p>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
        <div class="relative">
          <input
            id="password"
            type="password"
            formControlName="password"
            class="input-style !border-gray-300 focus:!border-blue-600 focus:ring-1 focus:ring-blue-600"
            placeholder="••••••••"
          />
        </div>
        <p *ngIf="authForm.controls.password.invalid && authForm.controls.password.touched" class="mt-1 text-xs text-red-500">
          A senha é obrigatória.
        </p>
      </div>

      <div class="flex items-center justify-between">
        <div class="flex items-center">
          <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
          <label for="remember-me" class="ml-2 block text-sm text-gray-900">
            Lembrar-me
          </label>
        </div>

        <div class="text-sm">
          <a href="#" class="font-medium text-blue-600 hover:text-blue-500">
            Esqueceu a senha?
          </a>
        </div>
      </div>

      <div>
        <button
          type="submit"
          class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-700 hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors duration-200"
          [disabled]="authForm.invalid"
        >
          Entrar
        </button>
      </div>
    </form>

    <div class="mt-6 text-center">
      <p class="text-sm text-gray-600">
        Não tem uma conta?
        <a (click)="regsiterNavigate()" class="font-medium text-blue-600 cursor-pointer hover:text-blue-500">
          Registre-se agora
        </a>
      </p>
    </div>
  </div>
</div>
