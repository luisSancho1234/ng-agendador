<div class="mt-10 flex items-center justify-center">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 space-y-8">
    <div class="text-center">
      <h1 class="text-3xl font-extrabold text-blue-900">Criar Conta</h1>
      <p class="mt-2 text-sm text-gray-600">Preencha os dados abaixo para se registrar</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Nome Completo</label>
        <div class="relative">
          <input
            id="name"
            type="text"
            formControlName="usuTxNome"
            class="input-style !border-gray-300 focus:!border-blue-600 focus:ring-1 focus:ring-blue-600"
            placeholder="Seu nome"
          />
        </div>
        <p *ngIf="registerForm.controls.usuTxNome.invalid && registerForm.controls.usuTxNome.touched" class="mt-1 text-xs text-red-500">
          <span *ngIf="registerForm.get('usuTxNome')?.hasError('required')">O nome é obrigatório.</span>
          <span *ngIf="registerForm.get('usuTxNome')?.hasError('minlength')">O nome deve ter pelo menos 3 caracteres.</span>
        </p>
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <div class="relative">
          <input
            id="email"
            type="email"
            formControlName="usuTxEmail"
            class="input-style !border-gray-300 focus:!border-blue-600 focus:ring-1 focus:ring-blue-600"
            placeholder="seu.email@exemplo.com"
          />
        </div>
        <p *ngIf="registerForm.controls.usuTxEmail.invalid && registerForm.controls.usuTxEmail.touched" class="mt-1 text-xs text-red-500">
          <span *ngIf="registerForm.get('usuTxEmail')?.hasError('required')">O email é obrigatório.</span>
          <span *ngIf="registerForm.get('usuTxEmail')?.hasError('email')">Por favor, insira um email válido.</span>
        </p>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
        <div class="relative">
          <input
            id="password"
            type="password"
            formControlName="usuTxSenha"
            class="input-style !border-gray-300 focus:!border-blue-600 focus:ring-1 focus:ring-blue-600"
            placeholder="••••••••"
          />
        </div>
        <p *ngIf="registerForm.controls.usuTxSenha.invalid && registerForm.controls.usuTxSenha.touched" class="mt-1 text-xs text-red-500">
          <span *ngIf="registerForm.get('usuTxSenha')?.hasError('required')">A senha é obrigatória.</span>
          <span *ngIf="registerForm.get('usuTxSenha')?.hasError('minlength')">A senha deve ter pelo menos 6 caracteres.</span>
        </p>
      </div>

      <div class="pt-4">
        <button
          type="submit"
          class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-700 hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors duration-200"
          [disabled]="registerForm.invalid"
        >
          Criar Conta
        </button>
      </div>
    </form>

    <div class="text-center">
      <p class="text-sm text-gray-600">
        Já tem uma conta?
        <a (click)="loginNavigate()" class="font-medium text-blue-600 cursor-pointer hover:text-blue-500">
          Faça login aqui
        </a>
      </p>
    </div>
  </div>
</div>
