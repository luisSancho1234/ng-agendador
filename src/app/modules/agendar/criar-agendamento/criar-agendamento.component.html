<div class="mt-10 flex items-center justify-center">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 space-y-8">
    <div class="text-center">
      <h1 class="text-3xl font-extrabold text-blue-900">
        {{ isEditing ? "Editar Agendamento" : "Criar Agendamento" }}
      </h1>
      <p class="mt-2 text-sm text-gray-600">
        {{
          isEditing
            ? "Atualize os dados do agendamento"
            : "Preencha os dados para criar um novo agendamento"
        }}
      </p>
    </div>

    <form
      [formGroup]="agendamentoForm"
      (ngSubmit)="onSubmit()"
      class="space-y-6"
    >
      <!-- Nome do Agendamento -->
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700 mb-1"
          >Nome do Agendamento</label
        >
        <div class="relative">
          <input
            id="name"
            type="text"
            formControlName="ageTxNome"
            class="input-style !border-gray-300 focus:!border-blue-600 focus:ring-1 focus:ring-blue-600"
            placeholder="Ex: Reunião com cliente"
          />
        </div>
        <p
          *ngIf="
            agendamentoForm.controls.ageTxNome.invalid &&
            agendamentoForm.controls.ageTxNome.touched
          "
          class="mt-1 text-xs text-red-500"
        >
          <span *ngIf="agendamentoForm.get('ageTxNome')?.hasError('required')"
            >O nome do agendamento é obrigatório.</span
          >
        </p>
      </div>

      <!-- Data do Agendamento -->
      <div>
        <label for="date" class="block text-sm font-medium text-gray-700 mb-1"
          >Data e Hora</label
        >
        <div class="relative">
          <input
            id="date"
            type="datetime-local"
            formControlName="ageDtAgenda"
            class="input-style !border-gray-300 focus:!border-blue-600 focus:ring-1 focus:ring-blue-600"
          />
        </div>
        <p
          *ngIf="
            agendamentoForm.controls.ageDtAgenda.invalid &&
            agendamentoForm.controls.ageDtAgenda.touched
          "
          class="mt-1 text-xs text-red-500"
        >
          <span *ngIf="agendamentoForm.get('ageDtAgenda')?.hasError('required')"
            >A data e hora são obrigatórias.</span
          >
        </p>
      </div>

      <!-- Submit and Cancel Buttons -->
      <div class="pt-4 flex gap-3">
        <button
          type="button"
          (click)="onCancel()"
          class="flex-1 py-3 px-4 border border-gray-300 rounded-lg shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors duration-200"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="flex-1 flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-700 hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors duration-200 disabled:bg-blue-400 disabled:cursor-not-allowed"
          [disabled]="agendamentoForm.invalid || isLoading"
        >
          {{ isLoading ? "Salvando..." : isEditing ? "Atualizar" : "Criar" }}
        </button>
      </div>
    </form>
  </div>
</div>
